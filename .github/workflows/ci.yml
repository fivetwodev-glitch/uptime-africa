name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Tests (PHP 8.3)

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, mbstring, zip, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dépendances PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Dépendances et build frontend
        run: |
          npm ci
          npm run build

      - name: Environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        run: ./vendor/bin/pint --test

      - name: Tests
        run: php artisan test
